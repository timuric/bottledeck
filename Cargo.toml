[package]
name = "bottledeck"
version = "0.4.1"
edition = "2024"
description = "Zero-touch multi-harness telemetry, Ratatui dashboard, and bottleneck analyzer for coding agents"
license = "MIT"
repository = "https://github.com/timuric/bottledeck"
homepage = "https://github.com/timuric/bottledeck"
readme = "README.md"
keywords = ["ai-agents", "telemetry", "tui", "codex", "claude-code"]
categories = ["command-line-utilities", "development-tools::profiling"]

[[bin]]
name = "bottledeck"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
dirs = "6"
ratatui = "0.30"
regex = "1"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
